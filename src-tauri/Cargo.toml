[package]
name = "lattice"
version = "0.1.0"
description = "Runtime data-structure visualizer for C++"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "lattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# Release: small, fast, stripped binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
